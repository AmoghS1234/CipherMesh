<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CipherMesh</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --accent-hover: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        body {
            width: 320px;
            padding: 20px;
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 14px;
            margin: 0;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: var(--text-primary);
        }
        
        .glass-panel {
            background: var(--surface-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .header h1::before {
            content: '🔐';
            -webkit-text-fill-color: initial;
        }
        
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 13px;
        }
        
        .status.connected {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        
        .status.disconnected {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        
        .status-icon {
            margin-right: 8px;
            font-size: 16px;
        }
        
        .section {
            padding: 16px;
            margin-bottom: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .section:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }
        
        .section h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .section p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.6;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
            box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
        }
        
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.23);
            background: var(--accent-hover);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        .footer {
            text-align: center;
            margin-top: 24px;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>CipherMesh</h1>
    </div>
    
    <div id="status" class="status disconnected glass-panel">
        <span class="status-icon">⏳</span>
        <span>Checking connection...</span>
    </div>
    
    <div class="section glass-panel">
        <h3>✨ Auto-Fill</h3>
        <p>Click the inline 🔐 button next to password fields to securely auto-fill your credentials.</p>
    </div>
    
    <div class="section glass-panel">
        <h3>🛡️ Save Passwords</h3>
        <p>When you log in to a new site, CipherMesh will automatically offer to securely save your password to your encrypted vault.</p>
    </div>
    
    <button id="openApp">Open CipherMesh App</button>
    
    <div class="footer">
        Version 1.1.0
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
